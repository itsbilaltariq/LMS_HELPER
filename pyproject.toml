[project]
name = "nust-lms-helper"
version = "0.1.0"
description = "NUST LMS Lab Assistant and Automation System powered by Groq"
authors = [
    { name = "itsbilaltariq", email = "mtariq.bscs24seecs@seecs.edu.pk" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "groq>=0.11.0",
    "cryptography>=43.0.1",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.2",
    "playwright>=1.47.0",
    "pymupdf>=1.24.10",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
